<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>튜브보드</title>
<style>
@font-face{font-family:"Pretendard Variable";font-style:normal;font-display:swap;font-weight:45 920;src:url(/fonts/PretendardVariable.woff2) format("woff2")}
:root{
  --bg:#f4f2ff; --panel:#ffffff; --ink:#16142c; --ink2:#5a5879; --rule:#dcd8f2; --track:#ebe8fb;
  --pop:#e11d2e; --hot:#ff7a2f; --cl:50%; --on-pop:#fff;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d1a; --panel:#141830; --ink:#f4f5ff; --ink2:#a9aed0; --rule:#272c52; --track:#1d2244;
  --pop:#ff4d57; --hot:#ff9a4d; --cl:64%; --on-pop:#1a0507}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 var(--font)}
.wrap{max-width:none;margin:0 auto;padding:0 40px}
a{color:inherit}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}

/* 상단 */
.mast .wrap{display:flex;align-items:center;gap:24px;padding-top:22px;padding-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:900;letter-spacing:-.04em;margin:0}.brand svg{width:44px;height:31px;flex:none}
.tools{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap}
.tools label{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:16px}
select,input[type=text]{font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:2px solid var(--rule);border-radius:12px;padding:8px 14px;min-height:46px}
button{font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:2px solid var(--rule);border-radius:12px;padding:8px 18px;min-height:46px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--pop)}
button.primary{background:var(--pop);border-color:var(--pop);color:var(--on-pop);font-weight:800}
.quota{min-width:200px;font-size:16px;color:var(--ink2)}
.quota b{color:var(--ink)}
.quota i{display:block;height:5px;background:var(--track);margin-top:5px;border-radius:3px;overflow:hidden}
.quota i span{display:block;height:100%;background:linear-gradient(90deg,var(--pop),var(--hot))}

/* 탭 */
.tabs .wrap{display:flex;gap:8px;padding-top:14px;padding-bottom:4px;overflow-x:auto}
.tabs button{border:0;border-radius:12px;background:transparent;padding:10px 20px;font-size:20px;font-weight:700;color:var(--ink2);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}

main{padding:22px 0 90px}
h2{font-size:28px;line-height:1.25;margin:56px 0 4px;letter-spacing:-.03em;font-weight:900}
.lead{margin:0 0 4px;color:var(--ink2);font-size:17px}
.msg{padding:16px 20px;border-radius:14px;background:var(--panel);margin:0 0 24px;font-size:17px;border:2px solid var(--rule)}
.msg.err{border-color:var(--hot)}
.asof{margin:14px 0 0;font-size:16px;color:var(--ink2)}

/* 맨 위 한 장: 지금 1위 */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:center;margin-top:10px}
.hero .big{position:relative;display:block;border-radius:20px;overflow:hidden;background:var(--track);text-decoration:none}
.hero .big img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.hero .big .tag{position:absolute;left:0;top:0;background:var(--hot);color:#fff;font-weight:900;font-size:22px;padding:10px 18px;border-bottom-right-radius:16px}
.hero .big .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 18px;background:linear-gradient(transparent,rgba(5,6,20,.88));color:#fff}
.hero .big .cap b{display:block;font-size:26px;line-height:1.3;letter-spacing:-.02em;font-weight:800}
.hero .big .cap span{font-size:18px;opacity:.9}
.hero h3{word-break:keep-all;margin:0 0 18px;font-size:44px;line-height:1.18;letter-spacing:-.04em;font-weight:900}
.hero h3 em{font-style:normal;color:var(--hot)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fact{background:var(--panel);border-radius:16px;padding:14px 18px}
.fact dt{font-size:16px;color:var(--ink2);margin:0}
.fact dd{margin:0;font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1.15}
.fact dd small{font-size:18px;font-weight:700;color:var(--ink2);margin-left:3px;letter-spacing:0}

/* 가로 한 줄 영상 목록 */
.rowhead{display:flex;align-items:flex-end;gap:16px;margin:50px 0 16px}
.rowhead h2{margin:0}
.rowhead .nav{margin-left:auto;display:flex;gap:8px}
.rowhead .nav button{width:48px;padding:0;font-size:20px}
.strip{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 0 14px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.vcard{flex:0 0 400px;text-decoration:none;scroll-snap-align:start;display:block}
.vcard .th{position:relative;border-radius:16px;overflow:hidden;background:var(--track)}
.vcard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .25s}
.vcard:hover img{transform:scale(1.04)}
.vcard .rk{position:absolute;left:0;top:0;background:var(--pop);color:var(--on-pop);font-weight:900;font-size:22px;line-height:1;padding:9px 14px;border-bottom-right-radius:14px}
.vcard .kind{position:absolute;right:8px;bottom:8px;background:rgba(5,6,20,.82);color:#fff;font-size:16px;font-weight:700;line-height:1;padding:6px 9px;border-radius:6px}
.vcard .kind.short{background:var(--hot)}
.vcard .boom{position:absolute;left:0;bottom:0;background:var(--hot);color:#fff;font-weight:900;font-size:22px;line-height:1;padding:10px 14px;border-top-right-radius:14px}
.vcard b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:19px;line-height:1.4;min-height:2.8em;margin-top:12px;font-weight:700}
.vcard:hover b{text-decoration:underline}
.vcard .ch{color:var(--ink2);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .st{margin-top:6px;font-size:18px;display:flex;justify-content:space-between;gap:10px;font-weight:700}
.vcard .st span:last-child{color:var(--ink2);font-weight:500;font-size:16px}

/* 카테고리 순위판 */
.sortbar{display:flex;gap:8px;margin:12px 0 18px;flex-wrap:wrap}
.sortbar button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{background:var(--panel);border-radius:20px;padding:8px 8px;max-width:1240px}
.chead,.crow{display:grid;grid-template-columns:44px minmax(150px,max-content) minmax(160px,1fr) 64px minmax(0,1.1fr);gap:0 16px;align-items:center;padding:0 16px 0 8px}
.chead{font-size:16px;color:var(--ink2);padding-top:10px;padding-bottom:8px}
.chead span:nth-child(1){text-align:center}
.crow{padding-top:7px;padding-bottom:7px;cursor:pointer;text-decoration:none;color:inherit;border-radius:12px}
.crow:hover{background:var(--track)}
.crow .no{font-size:24px;font-weight:900;text-align:center;color:var(--ink2)}
.crow.top .no{color:var(--hot)}
.crow .nm{min-width:230px;font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.crow .nm::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);margin-right:9px}
.crow .meter{display:grid;grid-template-columns:1fr 88px;gap:10px;align-items:center}
.crow .meter .trk{height:24px;background:var(--track);border-radius:6px;overflow:hidden}
.crow .meter i{display:block;height:100%;background:var(--c);border-radius:6px}
.crow .meter strong{font-size:22px;font-weight:900;text-align:right;white-space:nowrap}
.crow .cnt{font-size:17px;color:var(--ink2);text-align:right}
.crow .tv{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.crow.thin{opacity:.55}
@media (max-width:900px){.chead{display:none}.crow{grid-template-columns:36px 1fr 64px;row-gap:4px}.crow .meter{grid-column:2/-1}.crow .tv{grid-column:2/-1}}

/* 구글 급상승 검색어 */
.kw{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px 20px;margin-top:14px}
.kw a{display:grid;grid-template-columns:54px 1fr auto;gap:8px 14px;align-items:center;background:var(--panel);border-radius:16px;padding:12px 18px;text-decoration:none}
.kw a:hover{outline:2px solid var(--pop)}
.kw .n{font-size:30px;font-weight:900;color:var(--ink2);text-align:center}
.kw a:nth-child(-n+3) .n{color:var(--hot)}
.kw .q{font-size:22px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kw .t{font-size:17px;font-weight:700;color:var(--ink2)}
.kw .bar{grid-column:2/-1;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.kw .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pop),var(--hot))}

/* 주제 입력 */
.ask{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.ask input{flex:1 1 280px;max-width:480px;font-size:20px;font-weight:600}
.sr{position:absolute;left:-9999px}
.foot{margin-top:60px;color:var(--ink2);font-size:16px}

@media (max-width:980px){.hero{grid-template-columns:1fr}.hero h3{font-size:34px}}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .tools{margin-left:0;width:100%}
  .vcard{flex-basis:290px}
  .kw{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.vcard img{transition:none}}
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <h1 class="brand"><svg viewBox="0 0 44 31" aria-hidden="true"><rect width="44" height="31" rx="9" fill="var(--pop)"/><path d="M18 9.5v12l10.5-6z" fill="#fff"/></svg><span id="brand-name">튜브보드</span></h1>
  <div class="tools">
    <label for="kind"><span id="l-kind">형식</span> <select id="kind"><option value="all" id="o-all">쇼츠+롱폼</option><option value="short" id="o-short">쇼츠만</option><option value="long" id="o-long">롱폼만</option></select></label>
    <label for="region"><span id="l-region">지역</span> <select id="region"></select></label>
    <label for="lang"><span class="sr">Language</span> <select id="lang"><option value="ko">한국어</option><option value="en">English</option></select></label>
    <button id="refresh">새로 읽기</button>
    <div class="quota" id="quota" aria-live="polite"></div>
  </div>
</div></header>
<div class="tabs"><div class="wrap" role="tablist" id="tabs">
  <button role="tab" data-tab="popular" aria-selected="true" id="t-popular">지금 뜨는 영상</button>
  <button role="tab" data-tab="categories" aria-selected="false" id="t-categories">카테고리 대결</button>
  <button role="tab" data-tab="trends" aria-selected="false" id="t-trends">검색어 급상승</button>
  <button role="tab" data-tab="topic" aria-selected="false" id="t-topic">주제로 파고들기</button>
</div></div>
<main><div class="wrap">
  <div id="notice"></div>
  <div id="view"></div>
  <p class="foot"><span id="f-src"></span> <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube Terms of Service</a> · <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a></p>
  <p class="foot" id="f-ig"></p>
</div></main>
<script>
const $ = s => document.querySelector(s);
const QS = new URLSearchParams(location.search);
const KO = (QS.get("lang") || localStorage.getItem("lang") || navigator.language || "ko").toLowerCase().startsWith("ko");
const L = (ko, en) => KO ? ko : en;
const LOC = KO ? "ko-KR" : "en-US";
const CAT_EN = {"엔터":"Entertainment","코미디":"Comedy","영화·애니":"Film & Animation","스포츠":"Sports","동물":"Pets & Animals","노하우·스타일":"Howto & Style","자동차":"Autos","음악":"Music","과학·기술":"Science & Tech","뉴스":"News","인물·블로그":"People & Blogs","게임":"Gaming","여행":"Travel","교육":"Education"};
const REGION_EN = {"한국":"South Korea","미국":"United States","일본":"Japan","영국":"United Kingdom","독일":"Germany","프랑스":"France","브라질":"Brazil","인도":"India","인도네시아":"Indonesia","대만":"Taiwan","베트남":"Vietnam","태국":"Thailand"};
const ERR_EN = [["YOUTUBE_API_KEY 가 없습니다","YOUTUBE_API_KEY is missing. Put your key in the .env file (see README)."],["유튜브 하루 한도가 찼습니다","The daily YouTube API quota is used up. It resets at midnight Pacific time."],["유튜브 API 오류","YouTube API error: "],["네트워크 오류","Network error: "],["구글 트렌드를 읽지","Could not read Google Trends. Try again shortly."],["주제를 입력해","Enter a topic."],["로컬에서만","Local access only."],["예상하지 못한 오류","Unexpected error: "]];
const tr = m => { if (KO) return m; for (const [k, v] of ERR_EN) if (m.includes(k)) return v.endsWith(": ") ? v + m.split(/[:：] ?/).slice(1).join(": ") : v; return m; };
const cn = x => KO ? x : (CAT_EN[x] || x);
const state = {catKey: "median", kind: "all", tab: ["popular","categories","trends","topic"].includes(QS.get("tab"))?QS.get("tab"):"popular", region: localStorage.getItem("region") || "KR", days: 7, topic: ""};
const n = x => x == null ? "–" : x.toLocaleString(LOC);
function el(tag, attrs, ...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else e.setAttribute(k,v)}for(const c of kids)e.append(c);return e}
function msg(text, err){const d=$("#notice");d.replaceChildren();if(text)d.append(el("p",{class:"msg"+(err?" err":""),role:err?"alert":"status",text:err?tr(text):text}))}
const compact = x => KO ? (x>=1e8?(x/1e8).toFixed(1)+"억":x>=1e4?(x/1e4).toFixed(x>=1e6?0:1)+"만":n(x)) : (x>=1e9?(x/1e9).toFixed(1)+"B":x>=1e6?(x/1e6).toFixed(x>=1e7?0:1)+"M":x>=1e3?(x/1e3).toFixed(x>=1e5?0:1)+"K":n(x));
function ago(iso){const d=(Date.now()-new Date(iso))/864e5; return d<1?L("오늘","today"):d<30?L(Math.floor(d)+"일 전",Math.floor(d)+"d ago"):L(Math.floor(d/30)+"개월 전",Math.floor(d/30)+"mo ago")}
const CATS=["엔터","코미디","영화·애니","스포츠","동물","노하우·스타일","자동차","음악","과학·기술","뉴스","인물·블로그","게임","여행","교육"];
const hue = name => `hsl(${(Math.max(0,CATS.indexOf(name))*47+8)%360} 82% var(--cl))`;
const dur=t=>t>=3600?Math.floor(t/3600)+":"+String(Math.floor(t%3600/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"):Math.floor(t/60)+":"+String(t%60).padStart(2,"0");

async function call(path, params, refresh){
  const q = new URLSearchParams({region: state.region, ...params}); if(refresh) q.set("refresh","1");
  const r = await fetch(path+"?"+q), j = await r.json();
  if(!r.ok) throw new Error(j.error || r.statusText);
  setQuota(j.quotaUsed, j.quotaLimit); return j;
}
function setQuota(u,l){
  const q=$("#quota"); q.replaceChildren(el("span",{},L("오늘 API 사용 ","API used today "),el("b",{text:n(u)})," / "+n(l)),el("i",{},el("span",{style:`width:${Math.min(100,u/l*100)}%`})));
}
const stamp = (at,cached)=>{const t=new Date(at*1000).toLocaleTimeString(LOC,{hour:"2-digit",minute:"2-digit"});return KO?(cached?"저장된 결과":"방금 읽음")+", "+t+" 기준":(cached?"Cached result":"Just fetched")+", as of "+t};
const empty = t => el("p",{class:"msg",text:t});

function facts(items){
  const dl=el("dl",{class:"facts"});
  items.forEach(([k,v,u])=>dl.append(el("div",{class:"fact"},el("dt",{text:k}),el("dd",{},String(v),u?el("small",{text:u}):""))));
  return dl;
}
function strip(videos, badge){
  const row=el("div",{class:"strip"});
  videos.forEach((v,i)=>{
    const st=el("div",{class:"st"},el("span",{},L("조회 ","Views ")+n(v.views)),
      el("span",{}, v.subs==null?L("구독자 비공개","Subscribers hidden"):(L("구독자 ","Subscribers ")+compact(v.subs)), v.ratio!=null&&v.ratio<20?" · "+v.ratio.toLocaleString(LOC)+L("배","x"):""));
    const th=el("div",{class:"th"},el("img",{src:v.thumb,alt:"",loading:"lazy"}),el("span",{class:"rk",text:badge(v,i)}),
      el("span",{class:"kind"+(v.seconds<=60?" short":""),text:(v.seconds<=60?L("쇼츠 ","Short "):L("롱폼 ","Long "))+dur(v.seconds)}));
    if(v.ratio!=null && v.ratio>=20) th.append(el("span",{class:"boom",text:L("구독자의 "+Math.round(v.ratio).toLocaleString(LOC)+"배",Math.round(v.ratio).toLocaleString(LOC)+"x subscribers")}));
    row.append(el("a",{class:"vcard",href:v.url,target:"_blank",rel:"noopener"},th,el("b",{text:v.title}),el("div",{class:"ch",text:v.channel}),st));
  });
  return row;
}
function lane(title, lead, videos, badge, emptyText, id){
  if(state.kind==="short") videos=videos.filter(v=>v.seconds<=60);
  else if(state.kind==="long") videos=videos.filter(v=>v.seconds>60);
  if(!videos.length && state.kind!=="all") emptyText=L("선택한 형식의 영상이 없습니다.","No videos of this format.");
  const f=document.createDocumentFragment(), nav=el("div",{class:"nav"});
  const row=videos.length?strip(videos,badge):empty(emptyText);
  if(videos.length){
    const go=d=>()=>row.scrollBy({left:d*row.clientWidth*0.85,behavior:"smooth"});
    const l=el("button",{"aria-label":L("왼쪽","Left"),text:"←"}), r=el("button",{"aria-label":L("오른쪽","Right"),text:"→"});
    l.onclick=go(-1); r.onclick=go(1); nav.append(l,r);
  }
  f.append(el("div",{class:"rowhead",id:id||""},el("div",{},el("h2",{text:title}),lead?el("p",{class:"lead",text:lead}):""),nav),row);
  return f;
}
const byNew=vs=>vs.slice().sort((a,b)=>Date.parse(b.published)-Date.parse(a.published));
const rankBadge=(v,i)=>String(i+1), agoBadge=v=>ago(v.published);

function hero(v, headline, items){
  const big=el("a",{class:"big",href:v.url,target:"_blank",rel:"noopener"},
    el("img",{src:v.thumb,alt:""}),el("span",{class:"tag",text:L("지금 1위","No. 1 now")}),
    el("div",{class:"cap"},el("b",{text:v.title}),el("span",{text:`${v.channel} · ${L("조회 "+n(v.views)+"회",n(v.views)+" views")}`})));
  return el("div",{class:"hero"},big,el("div",{},headline,items));
}

async function load(refresh){
  const view=$("#view"); view.replaceChildren(); msg("");
  try{
    if(state.tab==="popular"){
      msg(L("읽는 중…","Loading…"));
      const j=await call("/api/popular",{},refresh); msg("");
      const d=j.data, vs=d.videos;
      if(!vs.length){view.append(empty(L("인기 급상승 영상이 없습니다.","No trending videos.")));return}
      const small=vs.filter(v=>v.subs!=null&&v.subs<10000&&v.ratio!=null&&!v.channel.endsWith(" - Topic"));
      const med=vs.map(v=>v.views).sort((a,b)=>a-b)[Math.floor(vs.length/2)];
      const [c1,c2]=d.categories, top=vs[0];
      const h=el("h3",{},L("지금은 ","Right now: "),el("em",{text:cn(c1[0])}),c2?" · ":"",c2?el("em",{text:cn(c2[0])}):"",L(" 천하입니다"," lead"));
      view.append(hero(top,h,facts([[L("인기 급상승","Trending"),vs.length,L("개","")],[L("조회수 중앙값","Median views"),compact(med),L("회","")],[L("쇼츠","Shorts"),d.shorts,L("개","")],[L("구독자 1만 미만 채널","Channels under 10K subs"),small.length,L("개","")]])));
